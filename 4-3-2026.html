<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 300px;
            padding: 5px;
            margin-top: 5px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            background-color: #f0fff0;
            border: 2px solid green;
            color: #2d6a2d;
            font-family: monospace;
            white-space: pre;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <h1>Form Registration</h1>

    <form id="courseForm">

        <p>
            <label for="studentName">Your Full Name:</label>
            <input type="text" id="studentName" placeholder="Masukkan nama di sini">
        </p>
        <p id="outputname"></p>

        <p>
            <label>Date of Birth:</label>
            <input type="date" id="dob">
        </p>
        <p id="outputdob"></p>

        <p>
            <label>Gender:</label>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </p>
        <p id="outputgender"></p>

        <p>
            <label>Religion:</label>
            <select id="religion">
                <option value="">--Select Religion--</option>
                <option value="Islam">Islam</option>
                <option value="Kristen">Kristen</option>
                <option value="Katolik">Katolik</option>
                <option value="Hindu">Hindu</option>
                <option value="Buddha">Buddha</option>
                <option value="Yahudi">Yahudi</option>
            </select>
        </p>
        <p id="outputreligion"></p>

        <p>
            <label>How did you know about SMK Telkom Malang?</label><br>
            <input type="checkbox" class="hobby" value="Friends"> Friends <br>
            <input type="checkbox" class="hobby" value="Social Media"> Social Media <br>
            <input type="checkbox" class="hobby" value="Banner Ads"> Banner Ads <br>
            <input type="checkbox" class="hobby" value="Newspaper"> Newspaper <br>
            <input type="checkbox" class="hobby" value="Website"> Website <br>
            <input type="checkbox" class="hobby" value="Brochure"> Brochure <br>
            <input type="checkbox" class="hobby" value="Others"> Others
        </p>
        <p id="outputhobbies"></p>

        <button type="submit">Submit</button>
        <button type="button" id="resetBtn">Reset</button>

    </form>

    <div id="output"></div>

    <script src="script.js"></script>
</body>
</html>
